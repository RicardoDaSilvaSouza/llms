services:

  # ─────────────────────────────────────────
  # PostgreSQL + pgvector (shared by LiteLLM & local-memory-mcp)
  # ─────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: litellm_db
    restart: always
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - litellm_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U llmproxy"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────
  # Ollama — serves bge-m3 (embeddings for memory)
  # Main LLM is on the RTX 4080 rig — NOT here
  # ─────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ai_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_FLASH_ATTENTION=1
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Pull bge-m3 on first boot, then exit
#  ollama-init:
#    image: ollama/ollama:latest
#    container_name: ai_ollama_init
#    depends_on:
#      ollama:
#        condition: service_healthy
#    volumes:
#      - ollama_data:/root/.ollama
#    entrypoint: ["/bin/sh", "-c"]
#    command: >
#      "OLLAMA_HOST=http://ollama:11434 ollama pull nomic-embed-text &&
#       echo 'Model pulled successfully'"
#    restart: "no"

  # ─────────────────────────────────────────
  # LiteLLM Proxy — routes Claude Code to RTX 4080 rig
  # ─────────────────────────────────────────
  litellm:
    build:
      context: .
      dockerfile: Dockerfile.litellm
    container_name: litellm
    ports:
      - "4000:4000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    user: root  # needed to access the socket
    entrypoint: >
      sh -c "apk add --no-cache docker-cli &&
      litellm --config /app/config.yaml --port 4000 --host 0.0.0.0"
    environment:
      - LITELLM_LOG=INFO
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - NINE_ROUTER_API_KEY=${NINE_ROUTER_API_KEY}
      - DATABASE_URL=postgresql://llmproxy:${DB_PASSWORD}@db:5432/litellm
      - STORE_MODEL_IN_DB=True
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY}
      - UI_USERNAME=${UI_USERNAME}
      - UI_PASSWORD=${UI_PASSWORD}
      - DISABLE_SCHEMA_UPDATE=false
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
      jcodemunch:
        condition: service_started   # ← wait for jcodemunch SSE to be ready

  # ─────────────────────────────────────────
  # local-memory-mcp (cunicopia/local-memory-mcp)
  # PostgreSQL + pgvector + Ollama embeddings
  # Uses stdio transport — Claude Code runs it directly via docker exec
  # NOT exposed as a long-running SSE server
  # ─────────────────────────────────────────
  local-memory-mcp:
    build:
      context: ./local-memory-mcp
    image: mcp/local-memory
    container_name: ai_memory_mcp
    restart: unless-stopped
    stdin_open: true
    tty: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: memory_mcp
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      OLLAMA_API_URL: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text:latest
      DEFAULT_MEMORY_DOMAIN: default
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy

  # ─────────────────────────────────────────
  # jCodeMunch MCP — structured code retrieval via tree-sitter
  # Runs as SSE server so LiteLLM can register it by URL
  # Uses Ollama (OpenAI-compatible) for AI symbol summaries
  # ─────────────────────────────────────────
  jcodemunch:
    build:
      context: .
      dockerfile: Dockerfile.jcodemunch
    container_name: ai_jcodemunch
    restart: unless-stopped
    command: >
      sh -c "pip install jcodemunch-mcp -q &&
             jcodemunch-mcp serve --transport streamable-http --host 0.0.0.0 --port 8901"
    # jcodemunch-mcp serve --transport sse --host 0.0.0.0 --port 8901
    ports:
      - "8901:8901"
    volumes:
      - ~/.code-index:/root/.code-index   # persist the code index
      - ${WORKSPACE_PATH:-~/workspace/}:/workspace:ro  # mount codebase to index (read-only)
    #environment:
      # Use Ollama as AI summarizer (OpenAI-compatible endpoint)
      #- OPENAI_API_BASE=http://ollama:11434/v1
      #- OPENAI_API_KEY=ollama              # Ollama ignores this value
      #- OPENAI_MODEL=${JCODEMUNCH_MODEL:-llama3.2}
      # Only allow localhost/internal summarizer endpoints (security default)
      #- JCODEMUNCH_ALLOW_REMOTE_SUMMARIZER=false
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8901/mcp')\" 2>&1 | grep -qv 'Connection refused' && exit 0 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s  # pip install needs time on first boot

  # ─────────────────────────────────────────
  # 9Router — AI coding router / OpenAI-compatible proxy
  # Dashboard: http://localhost:20128/dashboard
  # API:       http://localhost:20128/v1
  # ─────────────────────────────────────────
  9router:
    image: decolua/9router:latest
    container_name: 9router
    restart: unless-stopped

    # Bind to localhost only.
    # Other Compose services can still use http://9router:20128.
    ports:
      - "127.0.0.1:20128:20128"

    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production

      # Change these values in .env.
      INITIAL_PASSWORD: ${NINE_ROUTER_INITIAL_PASSWORD}
      JWT_SECRET: ${NINE_ROUTER_JWT_SECRET}
      API_KEY_SECRET: ${NINE_ROUTER_API_KEY_SECRET}
      MACHINE_ID_SALT: ${NINE_ROUTER_MACHINE_ID_SALT}

      # Public URL used by the browser/OAuth flows.
      NEXT_PUBLIC_BASE_URL: http://localhost:20128

      # Recommended if you expose the API outside localhost.
      REQUIRE_API_KEY: "true"

      # Keep disabled unless you need request/response logging.
      ENABLE_REQUEST_LOGS: "false"

    volumes:
      - 9router_data:/app/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:20128/api/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  litellm_postgres_data:
  ollama_data:
    name: ai_ollama_data
  9router_data:
    name: ai_9router_data
